name: 글 작성 참고 자료 갱신
on:
  workflow_dispatch:
    inputs:
      signals_json:
        description: 개인정보와 원문이 없는 관심 주제 집계
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: board-editorial-drafts
  cancel-in-progress: false
jobs:
  save:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 비식별 자료 검증과 저장
        env:
          SOURCE_SIGNALS_JSON: ${{ inputs.signals_json }}
        run: python tools/update_editorial_sources.py
