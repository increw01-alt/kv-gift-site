name: 시세 히스토리 자동 기록

on:
  schedule:
    # UTC 기준 → 한국시간 09:30 / 12:30 / 15:30 / 18:30 하루 4회
    - cron: "30 0,3,6,9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 협회 실시간 시세 기록
        run: python tools/record_price_history.py

      - name: 변경 시 커밋·푸시 (Cloudflare Pages 자동 배포)
        run: |
          if git diff --quiet data/price-history.json; then
            echo "변경 없음 (같은 스냅샷)"
            exit 0
          fi
          git config user.name "price-history-bot"
          git config user.email "actions@github.com"
          git add data/price-history.json
          git commit -m "시세 히스토리 자동 기록 $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
