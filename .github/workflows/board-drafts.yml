name: 게시판 안내 글 자동 작성
on:
  schedule:
    - cron: '0 1 * * 2'
    - cron: '0 1 * * 5'
  workflow_dispatch:
    inputs:
      board:
        description: 작성할 게시판
        type: choice
        options: [purchase, sale]
        default: purchase
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: board-editorial-drafts
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 생성기 검증
        run: python -m unittest discover -s tools/tests -v
      - name: 안내 글 작성 및 검토 요청
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'medium' }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BOARD: ${{ inputs.board }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python tools/run_board_draft.py
