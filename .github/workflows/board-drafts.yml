name: 게시판 글·이미지 자동 게시
on:
  schedule:
    # KST 09:02~22:47, 15분마다 부족분 점검. 게시 목표는 09:17~18:17 시간당 1편.
    # 지연/보류분은 다음 실행에서 보충하며 하루 10편이면 API 호출 없이 종료합니다.
    - cron: '2,17,32,47 0-13 * * *'
  workflow_dispatch:
    inputs:
      board:
        description: 작성할 게시판
        type: choice
        options: [auto, gc_tip, purchase, gc_information, sale, general_notice, sense, free, gc_word]
        default: auto
      preview_only:
        description: 검토 전용 생성 (켜면 글·배너·검수 Artifact만 저장하고 게시하지 않음)
        type: boolean
        default: false
      catch_up:
        description: 현재 시간대 목표에서 부족한 글만 게시 (복구 실행)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: board-editorial-drafts
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 생성기 검증
        run: python -m unittest discover -s tools/tests -v
      - name: 글·이미지 생성 및 자동 검수 후 게시
        id: publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.4-mini' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'medium' }}
          REQUESTED_BOARD: ${{ inputs.board }}
          PREVIEW_ONLY: ${{ inputs.preview_only || 'false' }}
          FOLLOW_SCHEDULE: ${{ github.event_name == 'schedule' || inputs.catch_up || 'false' }}
        run: python tools/run_board_publish.py
      - name: 공개 게시글과 배너 확인
        if: steps.publish.outputs.post_url != ''
        env:
          POST_URL: ${{ steps.publish.outputs.post_url }}
          POST_BANNER: ${{ steps.publish.outputs.banner }}
        run: python tools/verify_board_publication.py
      - name: API 사용량과 비용 기록 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: board-api-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/board-api-usage.json
          if-no-files-found: ignore
          retention-days: 90
      - name: 글과 배너 검토본 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: board-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/board-review/
          if-no-files-found: ignore
          retention-days: 90
