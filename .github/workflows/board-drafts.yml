name: 게시판 글·이미지 자동 게시
run-name: 게시판 자동 게시 · ${{ github.event_name == 'schedule' && 'github_schedule' || inputs.scheduler_source || 'manual' }} · ${{ inputs.scheduled_at || github.run_number }}
on:
  schedule:
    # 24시간 운영. Cloudflare가 5분마다 점검하고 GitHub는 매시 17분에 보완합니다.
    # 목표 시각 전·목표 충족·보류 대기·15회 한도 도달 시 API를 호출하지 않습니다.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      board:
        description: 작성할 게시판
        type: choice
        options: [auto, gc_tip, purchase, gc_information, sale, general_notice, sense, free, gc_word]
        default: auto
      preview_only:
        description: 검토 전용 생성 (켜면 글·배너·검수 Artifact만 저장하고 게시하지 않음)
        type: boolean
        default: false
      catch_up:
        description: 현재 시간대 목표에서 부족한 글만 게시 (복구 실행)
        type: boolean
        default: false
      scheduler_source:
        description: 실행 요청 출처 (외부 예약기가 기록)
        type: choice
        options: [manual, cloudflare_cron]
        default: manual
      scheduled_at:
        description: 외부 예약기의 예약 시각 (UTC)
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: board-editorial-drafts
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 생성기 검증
        run: python -m unittest discover -s tools/tests -v
      - name: 기존 게시글 공개 확인 기록 보완
        if: inputs.preview_only != true
        run: python tools/verify_board_publication.py --reconcile
      - name: 글·이미지 생성 및 자동 검수 후 게시
        id: publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.4-mini' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'medium' }}
          REQUESTED_BOARD: ${{ inputs.board }}
          PREVIEW_ONLY: ${{ inputs.preview_only || 'false' }}
          FOLLOW_SCHEDULE: ${{ github.event_name == 'schedule' || inputs.catch_up || 'false' }}
          SCHEDULER_SOURCE: ${{ inputs.scheduler_source || 'manual' }}
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: python tools/run_board_publish.py
      - name: 공개 게시글과 배너 확인
        if: steps.publish.outputs.post_url != ''
        env:
          POST_URL: ${{ steps.publish.outputs.post_url }}
          POST_BANNER: ${{ steps.publish.outputs.banner }}
        run: python tools/verify_board_publication.py
      - name: API 사용량과 비용 기록 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: board-api-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/board-api-usage.json
          if-no-files-found: ignore
          retention-days: 90
      - name: 글과 배너 검토본 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: board-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/board-review/
          if-no-files-found: ignore
          retention-days: 90
